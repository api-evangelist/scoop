name: Scoop
description: 'Scoop (Scoop Technologies, Inc.) is a San Francisco based future-of-work company backed by
  Index Ventures whose Scoop for Work product is a hybrid-work scheduling assistant. It plugs into
  employees existing calendar and Slack so teams can coordinate great in-office days, sync schedules,
  and see who will be in, while giving HR and workplace leaders analytics on office usage and hybrid
  work trends. Originally launched in 2015 as a carpool/commute service (takescoop.com), the company
  pivoted to hybrid workplace coordination. Note: as of this enrichment pass the product domain
  scoopforwork.com returns HTTP 410 Gone with a broken TLS certificate, and the legacy takescoop.com
  domain is parked for sale; no public developer API, OpenAPI, or documentation surface could be found.'
